interface:
  display_name: "CST Simulation Workflow"
  short_description: "Plan, run, validate, and report CST simulations through MCP."
  default_prompt: "Use $cst-simulation-workflow to plan or run this CST simulation on a safe working copy and validate its results."

dependencies:
  tools:
    - type: "mcp"
      value: "cst-studio-suite"
      description: "Local CST Studio Suite automation MCP server"

policy:
  allow_implicit_invocation: true
