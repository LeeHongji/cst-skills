[project]
name = "cst-studio-suite-mcp"
version = "0.1.0"
description = "MCP server for controlling CST Studio Suite through CST Python automation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "pyyaml>=6.0,<7",
]
optimization = [
    "optuna>=4.0,<5",
    "scikit-learn>=1.6,<2",
]
plotting = [
    "matplotlib>=3.10,<4",
]
full = [
    "optuna>=4.0,<5",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.10,<4",
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = [
    "cst_guardian",
]
py-modules = [
    "cst_automation",
    "cst_metrics",
    "cst_parameter_sweep",
    "cst_runtime_cli_bridge",
    "cst_schematic",
    "cst_trace",
    "cst_typed_wrapper_generator",
    "agent_mcp_server",
    "cst_agent_api",
    "cst_workspace",
    "cst_function_executor",
    "cst_review",
    "mcp_server",
]

[tool.uv]
package = false
