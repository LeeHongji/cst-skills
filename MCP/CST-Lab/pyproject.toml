[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cst-lab"
version = "0.1.0"
description = "Local experiment registry and lifecycle plane for CST Automation"
requires-python = ">=3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "mcp>=1.29,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.10,<4",
]
dev = [
  "pytest>=8.3,<9",
  "matplotlib>=3.10,<4",
]

[project.scripts]
cst-lab = "cst_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
